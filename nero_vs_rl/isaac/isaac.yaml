# Isaac 训练专用参数（任务本身的参数仍在 algorithms/config/default.yaml + dc1_site.yaml，两边仿真共用）
num_envs: 256
env_spacing: 3.0
physics_dt: 0.005            # 物理步长 5 ms，一个控制步 100 ms = 20 个物理步
object_library: 128          # 物体规格数：PhysX 不能每回合改尺寸，按 环境号 % 规格数 固定分配（尺寸/质量/摩擦各不同）
object_seed: 0
drive:                       # 关节驱动初值 = MuJoCo 的 kp / (kv + 关节阻尼 1.0)；step3 按真机滞后核对后再调
  stiffness: [90, 90, 90, 70, 45, 45, 40]
  damping: [8, 8, 8, 7, 5, 5, 4.5]
  effort: 100.0
  armature: 0.005
  joint_friction: 0.30
  gripper_stiffness: 300.0
  gripper_damping: 11.5
  gripper_effort: 40.0
belt_friction: 0.75           # 2026-11-26 用户给出（之前 1.1）；物体材质按 min 合成，带面接触实际取 min(0.75, 物体摩擦)
finger_friction: 2.0         # 接触按两者较小值（friction_combine_mode=min），实际由物体规格里的摩擦决定
train:
  total_timesteps: 8000000
  learning_rate: 0.0003
  buffer_size: 300000        # 每条约 8 KB，共约 2.5 GB 内存
  batch_size: 1024
  gamma: 0.95
  tau: 0.005
  learning_starts: 20000
  gradient_steps: 32         # 每次并行步（num_envs 条数据）更新次数
  net_arch: [256, 256]
  checkpoint_every: 500000
  success_window: 500        # 按最近这么多回合的成功率选最好模型
